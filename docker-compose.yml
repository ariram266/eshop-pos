services:
  postgres:
    image: postgres:16
    container_name: counterpoint-postgres
    environment:
      POSTGRES_DB: counterpoint
      POSTGRES_USER: counterpoint
      POSTGRES_PASSWORD: counterpoint_dev
    ports:
      - "5432:5432"
    volumes:
      - counterpoint-postgres:/var/lib/postgresql/data

volumes:
  counterpoint-postgres: