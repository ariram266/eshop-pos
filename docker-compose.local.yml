services:
  sql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: counterpoint-sql
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: CounterpointDev_123!
    ports:
      - "1433:1433"
    volumes:
      - counterpoint-sql:/var/opt/mssql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: counterpoint-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

volumes:
  counterpoint-sql:
