name: Deploy Counterpoint UI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_CLOUD_API_URL: ${{ vars.COUNTERPOINT_API_URL }}
          VITE_REGISTER_CODE: ${{ vars.COUNTERPOINT_REGISTER_CODE }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.COUNTERPOINT_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.COUNTERPOINT_ENTRA_TENANT_ID }}
          VITE_ENTRA_API_CLIENT_ID: ${{ vars.COUNTERPOINT_ENTRA_API_CLIENT_ID }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/dist"
          output_location: ""
          skip_app_build: true