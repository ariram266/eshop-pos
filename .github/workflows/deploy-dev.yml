name: Deploy Counterpoint Development

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    outputs:
      functions_name: ${{ steps.deploy.outputs.functions_name }}
      static_web_app_name: ${{ steps.deploy.outputs.static_web_app_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - id: deploy
        env:
          SQL_PASSWORD: ${{ secrets.COUNTERPOINT_SQL_ADMIN_PASSWORD }}
          ENTRA_CLIENT_ID: ${{ vars.COUNTERPOINT_ENTRA_CLIENT_ID }}
          ENTRA_ISSUER: ${{ vars.COUNTERPOINT_ENTRA_OPENID_ISSUER }}
        run: |
          az deployment group create \
            --resource-group "${{ secrets.COUNTERPOINT_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters environment=dev sqlAdministratorPassword="$SQL_PASSWORD" entraClientId="$ENTRA_CLIENT_ID" entraOpenIdIssuer="$ENTRA_ISSUER" \
            --query properties.outputs --output json > deployment-output.json
          echo "functions_name=$(jq -r '.functionsName.value' deployment-output.json)" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$(jq -r '.staticWebAppName.value' deployment-output.json)" >> "$GITHUB_OUTPUT"

  backend:
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - run: dotnet publish backend/CloudApi/CloudApi.csproj --configuration Release --output ./publish
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: cd publish && zip -r ../cloudapi.zip .
      - run: az functionapp deployment source config-zip --resource-group "${{ secrets.COUNTERPOINT_RESOURCE_GROUP }}" --name "${{ needs.infrastructure.outputs.functions_name }}" --src cloudapi.zip

  frontend:
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_CLOUD_API_URL: ${{ vars.COUNTERPOINT_API_URL }}
          VITE_REGISTER_CODE: ${{ vars.COUNTERPOINT_REGISTER_CODE }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.COUNTERPOINT_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.COUNTERPOINT_ENTRA_TENANT_ID }}
          VITE_ENTRA_API_CLIENT_ID: ${{ vars.COUNTERPOINT_ENTRA_API_CLIENT_ID }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /dist
          output_location: ''
          skip_app_build: true
